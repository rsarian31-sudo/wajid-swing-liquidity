<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wajid Swing Liquidity</title><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script></head><body><h1>Wajid Swing Liquidity</h1><div id="chart" style="height:600px"></div><script>const c=LightweightCharts.createChart(document.getElementById('chart'),{height:600});const s=c.addCandlestickSeries();fetch('https://wajid-ai-signals.vercel.app/api/liquidity?symbol=XAU%2FUSD&interval=15min&outputsize=300').then(r=>r.json()).then(d=>s.setData(d.candles));</script></body></html>
