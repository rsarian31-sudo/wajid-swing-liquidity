<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wajid Swing Liquidity</title><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script><style>body{margin:0;background:#0b0f14;color:#eee;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel{background:#10161e;border:1px solid #26303c;border-radius:12px;overflow:hidden}.chart{height:560px}.controls{display:flex;gap:7px}button,select{background:#151c25;color:#eee;border:1px solid #303b49;border-radius:8px;padding:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}.card{background:#151c25;padding:10px;border-radius:8px}.label{font-size:10px;color:#8793a3}.value{font-weight:800;font-size:16px;margin-top:4px}.buy{color:#38d996}.sell{color:#ff6879}.wait{color:#e8b45c}@media(max-width:650px){.chart{height:430px}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="wrap"><div class="top"><div><h2 style="margin:0">Wajid Swing Liquidity</h2><small style="color:#7f8b9a">XAU/USD • server-side strategy</small></div><div class="controls"><select id="tf"><option value="15min">15M</option><option value="5min">5M</option></select><button id="reload">Refresh</button></div></div><br><div class="panel"><div id="chart" class="chart"></div><div class="cards"><div class="card"><div class="label">SIGNAL</div><div id="signal" class="value wait">WAIT</div></div><div class="card"><div class="label">CONFIDENCE</div><div id="confidence" class="value">0%</div></div><div class="card"><div class="label">ENTRY</div><div id="entry" class="value">—</div></div><div class="card"><div class="label">STOP LOSS</div><div id="sl" class="value">—</div></div><div class="card"><div class="label">TP1</div><div id="tp1" class="value">—</div></div><div class="card"><div class="label">TP2</div><div id="tp2" class="value">—</div></div><div class="card"><div class="label">TP3</div><div id="tp3" class="value">—</div></div><div class="card"><div class="label">PRICE</div><div id="price" class="value">—</div></div></div></div><p id="status" style="color:#7f8b9a">Loading…</p></div>
<script>
const API='https://wajid-ai-signals.vercel.app/api/liquidity';
const el=document.getElementById('chart');
const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#10161e'},textColor:'#9aa6b5'},grid:{vertLines:{color:'#18202a'},horzLines:{color:'#18202a'}},rightPriceScale:{borderColor:'#28313d'},timeScale:{borderColor:'#28313d',timeVisible:true}});
const cs=chart.addCandlestickSeries({upColor:'#35d48a',downColor:'#ff6478',borderUpColor:'#35d48a',borderDownColor:'#ff6478',wickUpColor:'#35d48a',wickDownColor:'#ff6478'});
const hi=chart.addLineSeries({color:'#dca84a',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false});
const lo=chart.addLineSeries({color:'#4fa7ff',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false});
const lines={entry:chart.addLineSeries({color:'#35d48a',lineWidth:2,lastValueVisible:true,priceLineVisible:false}),sl:chart.addLineSeries({color:'#ff6478',lineWidth:2,lineStyle:1,lastValueVisible:true,priceLineVisible:false}),tp1:chart.addLineSeries({color:'#86d9b5',lineWidth:1,lineStyle:1,lastValueVisible:true,priceLineVisible:false}),tp2:chart.addLineSeries({color:'#86d9b5',lineWidth:1,lineStyle:1,lastValueVisible:true,priceLineVisible:false}),tp3:chart.addLineSeries({color:'#86d9b5',lineWidth:1,lineStyle:1,lastValueVisible:true,priceLineVisible:false})};
function f(x){return Number.isFinite(Number(x))?Number(x).toFixed(2):'—'}
function flat(s,data,v){if(!data.length||!Number.isFinite(Number(v))){s.setData([]);return}s.setData([{time:data[0].time,value:Number(v)},{time:data[data.length-1].time,value:Number(v)}])}
async function load(){const tf=document.getElementById('tf').value;document.getElementById('status').textContent='Loading '+tf+'…';try{const r=await fetch(API+'?symbol=XAU%2FUSD&interval='+tf+'&outputsize=300',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'API error');const data=d.candles.map(x=>({time:Number(x.time),open:Number(x.open),high:Number(x.high),low:Number(x.low),close:Number(x.close)}));cs.setData(data);hi.setData((d.swings.highs||[]).map(x=>({time:Number(x.time),value:Number(x.price)})));lo.setData((d.swings.lows||[]).map(x=>({time:Number(x.time),value:Number(x.price)})));const marks=(d.liquidity.sweeps||[]).map(x=>({time:Number(x.time),position:x.type==='BULLISH'?'belowBar':'aboveBar',shape:x.type==='BULLISH'?'arrowUp':'arrowDown',color:x.type==='BULLISH'?'#35d48a':'#ff6478',text:x.type}));if(d.signal.direction!=='WAIT'&&d.signal.time)marks.push({time:Number(d.signal.time),position:d.signal.direction==='BUY'?'belowBar':'aboveBar',shape:d.signal.direction==='BUY'?'arrowUp':'arrowDown',color:d.signal.direction==='BUY'?'#35d48a':'#ff6478',text:d.signal.direction});marks.sort((a,b)=>a.time-b.time);cs.setMarkers(marks);const p=d.tradePlan;Object.keys(lines).forEach(k=>lines[k].setData([]));if(p){flat(lines.entry,data,p.entry);flat(lines.sl,data,p.stopLoss);flat(lines.tp1,data,p.tp1);flat(lines.tp2,data,p.tp2);flat(lines.tp3,data,p.tp3)}const s=document.getElementById('signal');s.textContent=d.signal.direction;s.className='value '+(d.signal.direction==='BUY'?'buy':d.signal.direction==='SELL'?'sell':'wait');document.getElementById('confidence').textContent=(d.signal.probability||0)+'%';document.getElementById('entry').textContent=p?f(p.entry):'—';document.getElementById('sl').textContent=p?f(p.stopLoss):'—';document.getElementById('tp1').textContent=p?f(p.tp1):'—';document.getElementById('tp2').textContent=p?f(p.tp2):'—';document.getElementById('tp3').textContent=p?f(p.tp3):'—';document.getElementById('price').textContent=f(d.market.price);chart.timeScale().fitContent();document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){document.getElementById('status').textContent='Error: '+e.message}}
document.getElementById('reload').onclick=load;document.getElementById('tf').onchange=load;window.onresize=()=>chart.applyOptions({width:el.clientWidth});load();setInterval(load,60000);
</script></body></html>
